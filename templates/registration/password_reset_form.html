{% extends "base.html" %}
{% block title %}Reset Password | Skill Gap Analyzer{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card shadow-sm">
    <div class="card-body p-4">
      <div class="step-track" aria-hidden="true">
        <span class="step-dot is-current"></span>
        <span class="step-dot"></span>
        <span class="step-dot"></span>
        <span class="step-dot"></span>
      </div>
      <p class="step-label">Step 1 of 4 — Request reset</p>
      <h1 class="h4 mb-3">Reset password</h1>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="{{ form.email.id_for_label }}">Email</label>
          {{ form.email }}
          {% for error in form.email.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
        </div>
        <button class="btn btn-primary w-100" type="submit">Send reset link</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

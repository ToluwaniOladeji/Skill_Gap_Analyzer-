{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card shadow-sm"><div class="card-body p-4">
    <div class="step-track" aria-hidden="true">
      <span class="step-dot is-done"></span>
      <span class="step-dot is-done"></span>
      <span class="step-dot is-current"></span>
      <span class="step-dot"></span>
    </div>
    <p class="step-label">Step 3 of 4 — Choose new password</p>
    <h1 class="h4 mb-3">Choose a new password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100" type="submit">Update password</button>
    </form>
  </div></div>
</div>
{% endblock %}
